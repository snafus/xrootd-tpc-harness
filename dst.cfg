# Destination server for the multi-stream pull tests: plain HTTP, no
# authentication, files stored on the local disk so that their content can be
# compared with what the source served.
set run  = $BATS_TEST_TMPDIR
set name = $NAME
set port = $PORT
set data = $DATA

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $data

xrd.port $port
xrd.protocol XrdHttp:$port libXrdHttp.so
http.exthandler xrdtpc +notls libXrdHttpTPC.so

# The source runs on this host.
tpc.allow local
# Short stall timeouts (ongoing transfer, first byte) keep the fault tests quick.
tpc.timeout 6 12
tpc.trace all

all.sitename $name
http.trace all
