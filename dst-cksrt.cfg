# As dst.cfg, with the real-time checksum of XRootD 6 switched on: plain HTTP, no
# authentication, files stored on the local disk so that their content can be
# compared with what the source served.
set run  = $BATS_TEST_TMPDIR
set name = $NAME
set port = $PORT
set data = $DATA

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $data

xrd.port $port
xrd.protocol XrdHttp:$port libXrdHttp.so
http.exthandler xrdtpc +notls libXrdHttpTPC.so

# The source runs on this host.
tpc.allow local
# Short stall timeouts (ongoing transfer, first byte) keep the fault tests quick.
tpc.timeout 6 12
tpc.trace all

all.sitename $name
http.trace all

# The checksum is computed by the file system layer while the file is written
# and stored with the file when it is closed.  No TPC code is involved.
xrootd.chksum adler32
ofs.cksrt auto on
