# Source and destination server for the long-path throughput measurement.
# XrdOssMirage keeps no data: reads are generated and writes are discarded, so
# the disks of the test machine do not limit the transfer rate.
set run  = $RUN
set name = $NAME
set port = $PORT

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $run/$name

xrd.port $port
xrd.protocol XrdHttp:$port libXrdHttp.so
http.exthandler xrdtpc +notls libXrdHttpTPC.so
ofs.osslib +xattr libXrdOssMirage.so

# The two servers talk over a private test network.
tpc.allow private
tpc.allow local
tpc.trace info

all.sitename $name
